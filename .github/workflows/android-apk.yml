name: Compiler MY EV CAR Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier le SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstituer intégralement le site V36
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build app/src/main/assets/site
          cat site_package/site_v36.part* > build/site-v36.zip
          echo 'f7a5146c647f7060f4c9e316d03cfe5a3b5beb235e1a00c5c6f2bcfe252fe5bb  build/site-v36.zip' | sha256sum -c -
          unzip -tq build/site-v36.zip
          unzip -oq build/site-v36.zip -d app/src/main/assets/site/
          test -s app/src/main/assets/site/index.html
          test -s app/src/main/assets/site/whatsapp-config.js
          test -s app/src/main/assets/site/images/alumi-article-1-photo-reelle.webp
          test -s app/src/main/assets/site/images/alumi-article-3-securite-photo-reelle.webp
          echo "Fichiers embarqués : $(find app/src/main/assets/site -type f | wc -l)"
      - name: Compiler l'APK avec Android Gradle Plugin
        run: gradle --no-daemon assembleDebug
      - name: Vérifier que les fichiers du site sont dans l'APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Fq 'assets/site/index.html'
          unzip -l "$APK" | grep -Fq 'assets/site/whatsapp-config.js'
          unzip -l "$APK" | grep -Fq 'assets/site/images/alumi-article-1-photo-reelle.webp'
          ls -lh "$APK"
      - name: Déposer le nouvel APK V38
        uses: actions/upload-artifact@v4
        with:
          name: MY_EV_CAR_ANDROID_V38_COMPLET
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
