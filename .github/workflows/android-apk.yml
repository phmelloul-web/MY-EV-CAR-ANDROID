name: Compiler MY EV CAR Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verifier l'adresse du site
        run: |
          grep -Fq 'https://broad-moon-14ca.phmelloul.workers.dev/' app/src/main/java/com/myevcar/mobile/MainActivity.java
      - name: Compiler l'APK de test
        run: gradle --no-daemon assembleDebug
      - name: Verifier l'APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          ls -lh "$APK"
      - name: Fournir l'APK Android V41
        uses: actions/upload-artifact@v4
        with:
          name: MY_EV_CAR_ANDROID_V41_SITE_LIVE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
