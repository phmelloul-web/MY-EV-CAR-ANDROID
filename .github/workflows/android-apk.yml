name: Compiler myevcarv1 version complete
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Integrer le site MY EV CAR V40 et ses photos
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://broad-moon-14ca.phmelloul.workers.dev"
          TARGET="app/src/main/assets/site"
          mkdir -p "$TARGET/images"
          curl -fLSs --retry 3 --max-time 60 --connect-timeout 15 "$ROOT/" -o "$TARGET/index.html"
          curl -fLSs --retry 3 --max-time 60 --connect-timeout 15 "$ROOT/whatsapp-config.js" -o "$TARGET/whatsapp-config.js"
          grep -Fq "bandeau-comparatif-100km-v40.png" "$TARGET/index.html"
          PHOTO_LIST="al7-interieur-officiel-rond-1.png al7-interieur-officiel-rond-2.png alumi-article-1-antilles.png alumi-article-1-photo-reelle.webp alumi-article-2-antilles.png alumi-article-3-securite-photo-reelle.webp alumi-jeunes-mobilite-originale.png alumi-jeunes-mobilite-originale.webp astra-01-jaune.webp astra-02-gris.webp astra-04-jaune-studio.webp astra-06-gris-arriere.webp astra-08-interieur.webp astra-09-tableau.webp l6-photo-3-180km-3-3kw.webp l6-photo-4-bluetooth-vocal.jpg l6-photo-5-portes-ouvertes.jpg l6-photo-6-14plus.jpg l6-photo-7-gris-orange.jpg linktour-alumi-blanche-detouree.png linktour-elite-coffre-nettoye.png new1.jpeg new2.jpeg new6.jpeg new7.jpeg bandeau-comparatif-100km-v40.png"
          for photo in $PHOTO_LIST; do
            curl -fLSs --retry 3 --max-time 90 --connect-timeout 15 "$ROOT/images/$photo" -o "$TARGET/images/$photo"
            test -s "$TARGET/images/$photo"
          done
          python3 -c 'from pathlib import Path; r=Path("app/src/main/assets/site"); fs=[p for p in r.rglob("*") if p.is_file()]; n=sum(p.stat().st_size for p in fs); print("Fichiers:",len(fs),"Octets:",n); assert len(fs)>=27; assert n>10000000; assert (r/"images/bandeau-comparatif-100km-v40.png").stat().st_size>400000'
      - name: Compiler APK Android
        run: gradle --no-daemon assembleDebug
      - name: Verifier le contenu complet et la signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          grep -E "^(package:|application-label:)" apk-info.txt
          grep -Fq "package: name='com.myevcar.v1.complete'" apk-info.txt
          grep -Fq "application-label:'myevcarv1'" apk-info.txt
          unzip -l "$APK" | grep -F "assets/site/index.html"
          unzip -l "$APK" | grep -F "assets/site/images/bandeau-comparatif-100km-v40.png"
          unzip -l "$APK" | grep -F "assets/site/images/astra-02-gris.webp"
          unzip -l "$APK" | grep -F "assets/site/images/linktour-alumi-blanche-detouree.png"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          test "$(stat -c %s "$APK")" -gt 8000000
          cp "$APK" myevcarv1.apk
          ls -lh myevcarv1.apk
      - name: Mettre APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: myevcarv1-COMPLET
          path: myevcarv1.apk
          if-no-files-found: error
          retention-days: 30
