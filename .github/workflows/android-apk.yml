name: Compiler MY EV CAR Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier le SDK Android préinstallé
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler l'APK avec Android Gradle Plugin
        run: gradle --no-daemon assembleDebug
      - name: Enregistrer l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: MY_EV_CAR_ANDROID_V37_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
