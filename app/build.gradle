plugins {
    id 'com.android.application'
}
android {
    namespace 'com.myevcar.mobile'
    compileSdk 35
    defaultConfig {
        // Nouvelle application indépendante de la précédente MY EV CAR.
        applicationId 'com.myevcar.v1'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
